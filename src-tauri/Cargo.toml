[package]
name = "dfy-spatialdata-system"
version = "0.1.1"
description = "dfy-spatialdata-system desktop application"
authors = ["you"]
edition = "2021"
# 关闭 src/bin/* 诊断工具的自动构建：这些是开发期排查工具，不属应用交付物。
# 不关掉的话 macOS universal 打包必失败——tauri 只 lipo 主程序，却要按 cargo
# 元数据把全部 19 个 bin 拷进 .app（`dwg_diag does not exist`，即原项目当年
# 砍 macOS 构建的真实原因），Windows/Linux 侧还会把它们塞进安装包。
autobins = false
default-run = "dfy-spatialdata-system"

[[bin]]
name = "dfy-spatialdata-system"
path = "src/main.rs"

[lib]
name = "dfy_spatialdata_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitflags = "2"

rusqlite = { version = "0.37", features = ["bundled"] }
sled = "0.34"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
rumqttc = "0.24"
tokio = { version = "1", features = ["full"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "mysql", "tls-rustls"] }
redis = { version = "0.27", features = ["tokio-comp"] }
mongodb = "3"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"

acadrust = "0.3"
encoding_rs = "0.8"
