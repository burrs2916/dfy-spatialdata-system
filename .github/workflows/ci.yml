name: CI / Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - run: pnpm install
      - run: pnpm exec tsc --noEmit

  rust-check:
    name: Rust Check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: spatialdata-v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cargo fmt
        run: |
          cd src-tauri
          cargo fmt -- --check

      - name: Cargo clippy
        run: |
          cd src-tauri
          cargo clippy --all-features -- -W clippy::all

      - name: Cargo test
        run: |
          cd src-tauri
          cargo test --all-features

  publish-tauri:
    name: Publish ${{ matrix.platform }}
    needs: [frontend-check, rust-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-22.04
            args: ''
          - platform: Windows
            runner: windows-latest
            args: ''
          # macOS：单 job 出 universal 二进制（Apple Silicon + Intel 都能跑）。
          # 原项目曾因 notification 插件问题砍掉 macOS 双构建，此处恢复为更省
          # runner 的 universal 方案；首跑若仍撞插件问题再降级 arm64 单架构。
          - platform: macOS
            runner: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Strawberry Perl (Windows)
        if: matrix.platform == 'Windows'
        run: choco install strawberryperl -y

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - run: pnpm install

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macOS' && 'aarch64-apple-darwin x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: spatialdata-v1

      # 构建与发布解耦（对齐 dfy-ops 控制台 windows-build.yml 的模式）：
      # 1) 每次 push 都构建并传 Artifacts —— run 页面底部直接下载；
      # 2) 仅打 v* tag 时才发 Release —— 避免同版本重复上传 already_exists 冲突
      #    （tauri-action 不覆盖已有资产，历史踩坑：app-v0.1.0 连续两次红跑）。
      - name: Build Tauri
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: dfy-spatial-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          retries: 5
          body: |
            ## dfy-spatialdata-system

            ### 🍎 macOS
            The app uses ad-hoc code signing. On first launch:
            1. Right-click the app and select "Open"
            2. Click "Open" in the security dialog
            3. Or go to **System Settings > Privacy & Security** and click "Open Anyway"

            ### 🪟 Windows
            Run the `_x64-setup.exe` installer directly (NSIS, silent: `/S`).

            ### 🐧 Linux
            ```bash
            chmod +x *_amd64.AppImage
            ./*_amd64.AppImage
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
